<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom</title>
  <link rel="stylesheet" href="travel_recommendation.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">TravelBloom</div>

    <div class="nav-links">
      <a href="travel_recommendation.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>

    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Search beach, temple, country...">
      <button id="searchBtn">Search</button>
      <button id="clearBtn">Clear</button>
    </div>
  </nav>
  <section id="results" class="results"></section>
  <section class="hero">
    <div class="hero-content">
      <h1>Explore the World, Discover Your Next Destination</h1>
      <p>
        Travel is more than seeing new places. It's about meeting new cultures,
        tasting new flavors, and collecting stories that last a lifetime.
        Search for beaches, temples, and countries to find your perfect trip.
      </p>
      <button class="book-btn">Book Now</button>

      <div class="social-icons">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </section>

  <script src="travel_recommendation.js"></script>
</body>
</html>
